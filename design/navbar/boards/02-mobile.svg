<text x="540" y="204" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">72 px tall, background #0E1310, hairline top</text>
<text x="540" y="226" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">five equal slots, 78 px each at 390 px width</text>
<text x="540" y="248" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">each slot is a 72 x 72 target, above the 44 px minimum</text>
<text x="540" y="270" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">content above reserves 72 px plus safe-area inset</text>
<text x="540" y="336" font-family="Roboto, Liberation Sans, sans-serif" font-size="11" font-weight="700" fill="#C9D98F" text-anchor="start" letter-spacing="1.0" opacity="1">ACTIVE STATE</text>
<text x="540" y="360" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">pill 48 x 32 r14, acid 12%, border lineStrong 55%</text>
<text x="540" y="382" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">icon and label in acid, weight 600</text>
<text x="540" y="404" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">dashed outline shows where the pill came from</text>
<text x="540" y="426" font-family="Roboto, Liberation Sans, sans-serif" font-size="12" font-weight="400" fill="#9AA696" text-anchor="start" letter-spacing="0" opacity="1">travel 220 ms, same curve as the rail</text>
<text x="96" y="500" font-family="Roboto, Liberation Sans, sans-serif" font-size="11" font-weight="400" fill="#828F80" text-anchor="start" letter-spacing="0" opacity="1">Board 2 of 3. Labels in Indonesian, matching the current app strings.</text>
